name: MReYs Pipeline

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DO_IP: ${{ secrets.DO_IP_ADDRESS }}
  DO_USER: ${{ secrets.DO_SSH_USER }}
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  APP_NAME: mreys-net
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/mreys-net
  CONTAINER_NAME: mreys-net

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3
      # Set up Node.js
      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      # Install dependencies
      - name: Install Dependencies
        working-directory: ./src
        run: |
          npm ci
      # Run TypeScript and Tailwind Build
      - name: Build React App
        working-directory: ./src
        run: |
          npm run build

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3
      # Set up Docker
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:latest

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # - name: Set up SSH
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ env.SSH_KEY }}" > ~/.ssh/id_rsa
      #     chmod 600 ~/.ssh/id_rsa
      #     ssh-keyscan -H ${{ env.DO_IP }} >> ~/.ssh/known_hosts

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Pull and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DO_USER }}@${{ env.DO_IP }} << 'EOF'
            docker pull ${{ env.IMAGE_NAME }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -v $(pwd)/src:/app \
              -v /app/node_modules \
              --network nginx_proxy-network \
              -p 80:80 \
              ${{ env.IMAGE_NAME }}
          EOF
